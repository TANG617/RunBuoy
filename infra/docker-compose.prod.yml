# Keep the network-generation label on every service. Bumping it forces a
# one-time recreation so containers cannot remain attached to an older
# physical network while Compose's logical `default` network stays unchanged.
services:
  db:
    labels:
      com.runbuoy.network-generation: "1"
    restart: unless-stopped

  api:
    labels:
      com.runbuoy.network-generation: "1"
    env_file: !override
      - ${RUNBUOY_ENV_FILE:-.env.example}
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      # The bundled ingress has a fixed address so only its sanitized/appended
      # X-Forwarded-For chain is trusted. Direct API callers remain untrusted.
      TRUSTED_PROXY_CIDRS: "172.30.77.10/32"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    labels:
      com.runbuoy.network-generation: "1"
    env_file: !override
      - ${RUNBUOY_ENV_FILE:-.env.example}
    volumes:
      - "${APNS_PRIVATE_KEY_HOST_PATH:?set APNS_PRIVATE_KEY_HOST_PATH}:/run/secrets/apns_key.p8:ro"

  migrate:
    labels:
      com.runbuoy.network-generation: "1"
    env_file: !override
      - ${RUNBUOY_ENV_FILE:-.env.example}

  caddy:
    image: caddy:2-alpine
    labels:
      com.runbuoy.network-generation: "1"
    environment:
      RUNBUOY_HOST: "${RUNBUOY_HOST:?set RUNBUOY_HOST}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - runbuoy-caddy-data:/data
      - runbuoy-caddy-config:/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.77.10

volumes:
  runbuoy-caddy-data:
  runbuoy-caddy-config:

networks:
  default:
    # Keep the network name versioned. Production hosts may already have the
    # legacy Compose-managed network without IPAM; a new explicit name lets
    # Compose migrate containers without deleting the persistent database
    # volume or trying to attach Caddy's static address to that old network.
    name: runbuoy-private-v1
    ipam:
      config:
        - subnet: 172.30.77.0/24
