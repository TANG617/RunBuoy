[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbuoy-server"
version = "0.1.0"
description = "RunBuoy read-only projection, pairing, and APNs service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "mypy>=1.12,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
runbuoy-api = "app.main:run"
runbuoy-outbox = "worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/"]
