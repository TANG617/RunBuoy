[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbuoy-sdk"
version = "0.1.0"
description = "Structured local progress client for RunBuoy"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runbuoy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["runbuoy"]
