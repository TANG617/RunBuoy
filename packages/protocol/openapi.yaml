openapi: 3.1.0
info:
  title: RunBuoy API
  version: 1.1.0
  description: >-
    One-way synchronization API. Machines may write safe execution events;
    devices may read projections and manage only their own receiving plane.
servers:
  - url: https://api.example.runbuoy.dev
paths:
  /v1/devices/bootstrap:
    post:
      operationId: bootstrapDevice
      responses:
        "201":
          description: Anonymous workspace and scoped device credential
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/devices/{device_id}/notification-token:
    put:
      operationId: registerNotificationToken
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Token registered } }
  /v1/devices/{device_id}/push-to-start-token:
    put:
      operationId: registerPushToStartToken
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Token registered } }
  /v1/devices/{device_id}/activity-sync:
    post:
      operationId: syncDeviceActivities
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Activities reconciled } }
  /v1/devices/{device_id}:
    delete:
      operationId: resetDevice
      summary: Reset this iPhone's Server-side receiving identity
      description: >-
        Revokes the authenticated Device credentials, clears its APNs tokens,
        invalidates its Activity bindings, removes its subscriptions, and cancels
        pending push delivery to the Device. It does not delete Workspace Run history.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses:
        "204": { description: Device receiving identity reset }
        "403":
          description: Authenticated Device does not own the path identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/live-activities/{activity_id}/update-token:
    put:
      operationId: registerActivityUpdateToken
      security: [{ bearerAuth: [] }]
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses: { "204": { description: Token registered } }
  /v1/device-preferences:
    patch:
      operationId: updateDevicePreferences
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Preferences updated } }
  /v1/machine-subscriptions/{subscription_id}:
    delete:
      operationId: deleteMachineSubscription
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: >-
            This Device stopped receiving from the Machine; the Machine and its
            credentials remain active
  /v1/pairing-sessions:
    post:
      operationId: createPairingSession
      responses:
        "201": { description: One-time pairing session }
        "409": { $ref: "#/components/responses/ResourceQuotaExceeded" }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/pairing-sessions/{session_id}:
    get:
      operationId: getPairingSession
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { description: Pairing status }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/pairing-sessions/{session_id}/claim:
    post:
      operationId: claimPairingSession
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses: { "200": { description: Session claimed } }
  /v1/pairing-sessions/{session_id}/exchange:
    post:
      operationId: exchangePairingSecret
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses: { "200": { description: Scoped machine credential } }
  /v1/runs:
    get:
      operationId: listRuns
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Run projections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunProjection" }
  /v1/runs/{run_id}:
    put:
      operationId: upsertRun
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunUpsert" }
      responses:
        "200":
          description: Run projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunProjection" }
        "409": { $ref: "#/components/responses/ResourceQuotaExceeded" }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
    get:
      operationId: getRun
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Run detail and safe feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
  /v1/runs/{run_id}/events:batch:
    post:
      operationId: ingestRunEvents
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/RunEvent" }
      responses:
        "200": { description: Idempotent ingestion result }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/machines:
    get:
      operationId: listMachines
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Paired machines } }
  /v1/machines/{machine_id}:
    patch:
      operationId: updateMachine
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/MachineId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachinePatch" }
      responses:
        "200": { description: Machine display name updated }
  /v1/machines/{machine_id}/revoke:
    post:
      operationId: revokeMachine
      summary: Revoke a Machine from an owning Device
      description: >-
        Revokes Machine and Webhook credentials, removes subscriptions, invalidates
        Activity bindings, and cancels pending push. Historical Runs remain readable.
        No instruction or control message is sent to the Machine.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/MachineId" }]
      responses:
        "204": { description: Machine credentials revoked }
        "404":
          description: Machine is not in the authenticated Device Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/machines/{machine_id}/revoke-self:
    post:
      operationId: revokeMachineSelf
      summary: Revoke the authenticated Machine credential
      description: >-
        Used by CLI unpair before deleting its local credential. This is an identity
        operation and never creates a Server-to-Machine command channel.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/MachineId" }]
      responses:
        "204": { description: Machine credential revoked }
        "403":
          description: Authenticated Machine does not own the path identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/workspaces/{workspace_id}/deletion-challenge:
    post:
      operationId: createWorkspaceDeletionChallenge
      summary: Create a short-lived deletion challenge
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionChallengeRequest" }
      responses:
        "200":
          description: One-use challenge bound to the Device and Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionChallenge" }
        "409":
          description: Explicit confirmation did not match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/workspaces/{workspace_id}:
    delete:
      operationId: deleteWorkspace
      summary: Delete all data in the authenticated anonymous Workspace
      description: >-
        Atomically deletes Machines, credentials, Devices, subscriptions, Runs,
        RunEvents, Notifications, Webhooks, Activity bindings, push outbox/attempts,
        deletion challenges, and audit rows. Backup copies expire under the configured
        backup retention policy.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceDeleteRequest" }
      responses:
        "204": { description: Workspace and all associated cloud data deleted }
        "409":
          description: Challenge is missing, invalid, rotated, used, or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /v1/notifications:
    get:
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Rich messages } }
    post:
      operationId: createNotification
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Notification accepted }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/webhooks:
    post:
      operationId: createWebhook
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Webhook credential created }
        "409": { $ref: "#/components/responses/ResourceQuotaExceeded" }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
  /v1/hooks/{hook_id}/notifications:
    post:
      operationId: createWebhookNotification
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/HookId" }]
      responses:
        "201": { description: Notification accepted }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/hooks/{hook_id}/runs/{external_run_id}:
    put:
      operationId: upsertWebhookRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/HookId" }
        - { $ref: "#/components/parameters/ExternalRunId" }
      responses:
        "200": { description: Webhook Run projection }
        "409": { $ref: "#/components/responses/ResourceQuotaExceeded" }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
  /v1/hooks/{hook_id}/runs/{external_run_id}/events:
    post:
      operationId: createWebhookRunEvent
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/HookId" }
        - { $ref: "#/components/parameters/ExternalRunId" }
      responses:
        "202": { description: Event accepted }
        "413": { $ref: "#/components/responses/RequestBodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitExceeded" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MachineId:
      name: machine_id
      in: path
      required: true
      schema: { type: string }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string }
    HookId:
      name: hook_id
      in: path
      required: true
      schema: { type: string }
    ExternalRunId:
      name: external_run_id
      in: path
      required: true
      schema: { type: string }
  headers:
    RateLimitBucket:
      description: Stable application rate-limit bucket name.
      schema: { type: string }
    RateLimitLimit:
      description: Maximum requests in the current fixed window.
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Unix timestamp when the current fixed window resets.
      schema: { type: integer, minimum: 0 }
    RetryAfter:
      description: Seconds until this request may be retried.
      schema: { type: integer, minimum: 1 }
  responses:
    RequestBodyTooLarge:
      description: Request body or event batch exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AbuseError" }
    RateLimitExceeded:
      description: The caller exhausted an application rate-limit bucket.
      headers:
        X-RateLimit-Bucket: { $ref: "#/components/headers/RateLimitBucket" }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AbuseError" }
    ResourceQuotaExceeded:
      description: A scoped resource quota has been reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AbuseError" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
    DeletionChallengeRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation: { const: DELETE }
      additionalProperties: false
    DeletionChallenge:
      type: object
      required: [challenge, expires_at]
      properties:
        challenge: { type: string, minLength: 16 }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    WorkspaceDeleteRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string, minLength: 16, maxLength: 256 }
      additionalProperties: false
    AbuseError:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code]
          properties:
            code: { type: string }
          additionalProperties: true
      additionalProperties: false
    MachinePatch:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false
    RunUpsert:
      type: object
      required: [machine_id, title]
      properties:
        machine_id: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        source: { type: [string, "null"], maxLength: 120 }
        cli_version: { type: [string, "null"], maxLength: 64 }
        execution_status:
          enum: [CREATED, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, LOST]
        live_activity_policy:
          enum: [automatic, immediate, disabled]
      additionalProperties: true
    RunProjection:
      type: object
      required:
        - id
        - workspace_id
        - machine_id
        - machine_name
        - title
        - execution_status
        - health_status
        - attention_status
        - created_at
        - updated_at
        - last_seq
        - sequence
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string }
        machine_id: { type: string }
        machine_name: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 200 }
        source: { type: [string, "null"], maxLength: 120 }
        execution_status:
          enum: [CREATED, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, LOST]
        health_status: { enum: [HEALTHY, STALE, OFFLINE] }
        attention_status: { enum: [NONE, INFORMATION, WARNING, ACTION_REQUIRED] }
        progress: { type: [object, "null"], additionalProperties: true }
        phase: { type: [string, "null"], maxLength: 120 }
        safe_message: { type: [string, "null"], maxLength: 500 }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        exit_code: { type: [integer, "null"] }
        termination_reason: { type: [string, "null"], maxLength: 120 }
        last_seq: { type: integer, minimum: 0 }
        sequence: { type: integer, minimum: 0 }
        safe_log_tail:
          type: [array, "null"]
          items: { type: string }
      additionalProperties: false
    RunDetail:
      type: object
      required: [run, events]
      properties:
        run: { $ref: "#/components/schemas/RunProjection" }
        events:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: false
    RunEvent:
      type: object
      required:
        - schema_version
        - event_id
        - run_id
        - machine_id
        - seq
        - type
        - occurred_at
        - payload
      properties:
        schema_version: { const: 1 }
        event_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        machine_id: { type: string }
        seq: { type: integer, minimum: 1 }
        type:
          enum:
            - run.created
            - run.starting
            - run.started
            - run.progress
            - run.phase_changed
            - run.message
            - run.attention_required
            - run.heartbeat
            - run.succeeded
            - run.failed
            - run.cancelled
            - run.lost
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
      additionalProperties: true
