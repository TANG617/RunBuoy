name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release source is an exactly tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          ancestry="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/${release_sha}...main" --jq '.status'
          )"
          if [[ "$ancestry" != "ahead" && "$ancestry" != "identical" ]]; then
            echo "::error::Release commit is not an ancestor of main."
            exit 1
          fi
          successful_runs="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$release_sha" \
              -f event=push \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length'
          )"
          if (( successful_runs < 1 )); then
            echo "::error::No successful main push CI run exists for $release_sha."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        working-directory: cli
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/runbuoy/__init__.py)"
          tag_version="${RELEASE_TAG#cli-v}"
          test -n "$package_version"
          test "$package_version" = "$tag_version"

      - name: Run CLI tests
        working-directory: cli
        run: |
          uv sync --all-groups --frozen
          uv run pytest

      - name: Build wheel and source distribution
        working-directory: cli
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine twine check cli/dist/*

      - name: Smoke-test installed wheel
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          uv tool install cli/dist/*.whl
          runbuoy --help
          runbuoy doctor --json

      - name: Generate CLI SBOM
        run: >-
          uv run --no-project python scripts/generate_release_manifests.py
          --component cli
          --output-dir artifacts
          --source-revision "$GITHUB_SHA"

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-package-distributions
          path: cli/dist/
          if-no-files-found: error

      - name: Upload CLI SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cli-release-manifest
          path: artifacts/runbuoy-cli.cdx.json
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runbuoy
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Create GitHub Release after PyPI publication
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Download CLI SBOM
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: cli-release-manifest
          path: artifacts/
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "RunBuoy CLI ${GITHUB_REF_NAME#cli-v}"
          fi
